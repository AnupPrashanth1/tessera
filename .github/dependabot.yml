version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      javascript-tooling:
        patterns:
          - '*eslint*'
          - 'typescript-eslint'
          - 'prettier'
          - 'globals'

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
