name: Feature request
description: Propose a new capability or improvement for Tessera.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, analyst, investigator, or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or capability.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend
        - AI Agents
        - Knowledge Graph
        - Data and Streaming
        - Infrastructure
        - Documentation
        - Security
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
    validations:
      required: false
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, or operational considerations
      description:
        Note sensitive data, permissions, audit logging, compliance, or reliability concerns.
    validations:
      required: false
